name: Loto 6-49 Python regression tests
on:
  push:
    branches:
      - feat/649-seven-system-4plus-coverage-20261109
  pull_request:
    branches:
      - main
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install tzdata
      - name: Verify standalone source bundles correctly
        run: python -c "from pathlib import Path; from tools.build_standalone import standalone_source; assert Path('loto649_standalone.py').read_text(encoding='utf-8') == standalone_source()"
      - name: Run all regression tests
        run: python -m unittest discover -s tests -v
